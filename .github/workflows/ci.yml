name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Generate protobuf
        run: make generate

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=main-${GITHUB_SHA::7}" -o dist/nanit-bridge ./cmd/nanit-bridge

      - name: Test
        run: go test -race ./...

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: nanit-bridge-linux-amd64
          path: dist/nanit-bridge
          retention-days: 14
